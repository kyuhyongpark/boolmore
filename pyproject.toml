[build-system]
requires = ["setuptools", "wheel", "Cython"]
build-backend = "setuptools.build_meta"

[project]
name = "boolmore"
version = "0.1.2"
authors = [{ name = "Kyu Hyong Park", email = "kyuhyongpark@gmail.com" }]
description = "Python package for refining Boolean models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["pyboolnet @ git+https://github.com/hklarner/pyboolnet",
                "joblib",
                "pandas",
                "python-sat",]

[project.optional-dependencies]
test = [
    "pytest",
]
notebook = [
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/kyuhyongpark/boolmore"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boolmore = ["*.pyx"]